[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holiday-tracker"
version = "0.1.0"
description = "Budget-first holiday price tracker: combines flight, accommodation and daily-spend data to find or track holidays that fit a budget."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
holiday-track = "holiday_tracker.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["holiday_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatting, not worth failing CI over.
# B008: typer's whole API relies on `= typer.Option(...)` / `typer.Argument(...)`
# as parameter defaults; that's idiomatic here, not a real mutable-default bug.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
